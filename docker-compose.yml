services:
  postgres:
    image: postgres:17
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpassword
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: