name: SecureLink CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: securelinkuser
          POSTGRES_PASSWORD: securelink_password
          POSTGRES_DB: securelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securelinkuser -d securelink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Create database tables
        env:
          PGPASSWORD: securelink_password
        run: |
          psql -h localhost -p 5432 -U securelinkuser -d securelink -f database/schema.sql

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: securelinkuser
          DB_PASSWORD: securelink_password
          DB_NAME: securelink
          PORT: 3000
        run: npm test